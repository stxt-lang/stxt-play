<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>STXT Playground</title>
	<meta name="description" content="Web playground for STXT: edit documents and grammars in the browser.">
	<link rel="canonical" href="https://play.stxt.dev/">
	<meta property="og:title" content="STXT Playground">
	<meta property="og:description" content="Edit STXT documents and grammars in the browser, with live validation.">
	<meta property="og:url" content="https://play.stxt.dev/">
	<meta property="og:type" content="website">
	<link rel="icon" href="favicon.ico?v=e17de22759" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=0bc3ca3a91">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=804f660991">
	<link rel="apple-touch-icon" href="apple-touch-icon.png?v=190cfbd9f4">
	<!-- Russo One: the identity font of the STXT wordmark, the same source as the portal (stxt.dev) -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/site.css?v=85bcb368c5">
</head>
<body>
	<header class="topbar">
		<span class="brand"><a class="brand-name" href="https://stxt.dev" title="STXT — the language site">STXT</a> <span class="brand-sub">Playground</span> <span id="app-version" class="brand-version" title="Playground version">v1.0.2</span></span>
		<span id="doc-title" class="doc-title"></span>
		<div class="topbar-controls">
			<div class="segmented" role="group" aria-label="Indentation">
				<button id="indent-tabs" type="button" aria-pressed="true" title="Indent with tabs: Tab inserts a tab, and the indentation of every document is converted (undoable)">Tabs</button>
				<button id="indent-spaces" type="button" aria-pressed="false" title="Indent with four spaces: Tab inserts spaces, and the indentation of every document is converted (undoable)">Spaces</button>
			</div>
			<button id="validation-toggle" type="button" class="switch" role="switch" aria-checked="true" title="Validate documents against the grammars of the workspace: a namespace no grammar covers is reported as SCHEMA_NOT_FOUND">
				<span class="switch-track"><span class="switch-thumb"></span></span>
				<span class="switch-label">Schema validation</span>
			</button>
			<button id="share" type="button" class="topbar-button" title="Copy a link that carries this workspace">Share</button>
			<nav class="topbar-links" aria-label="Links">
				<a href="https://stxt.dev/stxt-core-ref" title="Language reference on stxt.dev">Reference</a>
				<a href="https://github.com/stxt-lang/stxt-play" title="Source of the playground on GitHub">GitHub</a>
			</nav>
		</div>
	</header>
	<div id="status" class="status" role="status" aria-live="polite"></div>
	<!-- Narrow screens only: one pane at a time, picked here (see _layout.scss) -->
	<nav id="view-tabs" class="view-tabs" aria-label="Panes">
		<button type="button" data-view="documents" aria-selected="false">Documents</button>
		<button type="button" data-view="editor" aria-selected="true">Editor</button>
		<button type="button" data-view="problems" aria-selected="false">Problems <span class="view-tab-count" hidden>0</span></button>
	</nav>
	<div class="workbench">
		<aside id="sidebar" class="sidebar" aria-label="Documents">
			<header class="sidebar-header">
				<span class="sidebar-title">Documents</span>
				<button id="doc-reset" type="button" class="sidebar-button" title="Reset the workspace to the example documents" aria-label="Reset workspace">↺</button>
				<button id="doc-clear" type="button" class="sidebar-button" title="Remove every document and start from an empty one" aria-label="Clear workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4h6v2"></path></svg></button>
				<button id="doc-new" type="button" class="sidebar-button" title="New document" aria-label="New document">+</button>
			</header>
			<ul id="doc-list" class="doc-list" role="listbox" aria-label="Workspace documents"></ul>
			<footer class="sidebar-footer">Everything runs in your browser · saved locally</footer>
		</aside>
		<div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the document list" tabindex="0" title="Drag to resize the document list (double-click resets it)"></div>
		<main id="editor" class="editor" aria-label="STXT editor"></main>
	</div>
	<section class="problems" aria-label="Problems">
		<header class="problems-header">Problems <span id="problems-count" class="problems-count" aria-live="polite" aria-label="Number of problems">0</span></header>
		<ul id="problems-list" class="problems-list"></ul>
	</section>
	<script src="js/play.js?v=9bf5e94f6e"></script>
</body>
</html>
