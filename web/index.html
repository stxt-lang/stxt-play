<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>STXT Playground</title>
	<meta name="description" content="Web playground for STXT: edit documents and grammars in the browser.">
	<link rel="stylesheet" href="css/site.css">
</head>
<body>
	<header class="topbar">
		<span class="brand">STXT Playground</span>
		<span class="doc-title">Sample document</span>
		<span class="topbar-note">everything runs in your browser</span>
	</header>
	<main id="editor" class="editor" aria-label="STXT editor"></main>
	<section class="problems" aria-label="Problems">
		<header class="problems-header">Problems <span id="problems-count" class="problems-count">0</span></header>
		<ul id="problems-list" class="problems-list"></ul>
	</section>
	<script src="js/play.js"></script>
</body>
</html>
